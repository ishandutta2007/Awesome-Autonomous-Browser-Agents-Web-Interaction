<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <!-- Dynamic CSS animations -->
    <style>
      .orb {
        animation: pulseOrb 8s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: pulseOrb2 10s ease-in-out infinite alternate;
      }
      .flow-pulse {
        stroke-dasharray: 8, 8;
        animation: flowDash 20s linear infinite;
      }
      .wave-pulse {
        animation: waveAnim 6s ease-in-out infinite alternate;
      }
      .grid-pulse {
        animation: gridFade 4s ease-in-out infinite alternate;
      }
      @keyframes pulseOrb {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.25; }
        100% { transform: scale(1.25) translate(40px, -20px); opacity: 0.45; }
      }
      @keyframes pulseOrb2 {
        0% { transform: scale(1) translate(0px, 0px); opacity: 0.2; }
        100% { transform: scale(1.3) translate(-30px, 30px); opacity: 0.4; }
      }
      @keyframes flowDash {
        to { stroke-dashoffset: -400; }
      }
      @keyframes waveAnim {
        0% { transform: translateY(0); }
        100% { transform: translateY(-8px); }
      }
      @keyframes gridFade {
        0% { opacity: 0.12; }
        100% { opacity: 0.25; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Grid Lines -->
  <g class="grid-pulse" stroke="#334155" stroke-width="1" stroke-opacity="0.35">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <g>
    <circle class="orb" cx="220" cy="110" r="160" fill="url(#glowGrad)" filter="url(#glow)" />
    <circle class="orb-2" cx="980" cy="300" r="180" fill="#a855f7" filter="url(#glow)" opacity="0.3" />
    <circle class="orb" cx="600" cy="380" r="140" fill="#0284c7" filter="url(#glow)" opacity="0.25" />
  </g>

  <!-- Animated Connecting Agent Interaction Network Flows -->
  <g fill="none" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.4" class="flow-pulse">
    <path d="M 120 330 Q 350 290, 600 340 T 1080 320" />
    <path d="M 150 90 Q 400 130, 700 80 T 1100 110" />
  </g>

  <!-- Browser UI Mockup Window Elements in Background (Clean & Subtle) -->
  <g opacity="0.18" transform="translate(850, 40)">
    <rect width="280" height="170" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#eab308" />
    <circle cx="52" cy="18" r="5" fill="#22c55e" />
    <rect x="75" y="11" width="180" height="14" rx="4" fill="#334155" />
    <rect x="20" y="45" width="100" height="12" rx="3" fill="#64748b" />
    <rect x="20" y="70" width="240" height="8" rx="2" fill="#475569" />
    <rect x="20" y="88" width="200" height="8" rx="2" fill="#475569" />
    <rect x="20" y="106" width="220" height="8" rx="2" fill="#475569" />
    <rect x="20" y="130" width="70" height="22" rx="4" fill="#38bdf8" opacity="0.8" />
  </g>

  <!-- FOREGROUND: Main Content Area (Protected from obstruction) -->

  <!-- Top Badge / Category Tag -->
  <g transform="translate(60, 52)">
    <rect width="275" height="32" rx="16" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#cardShadow)" />
    <circle cx="16" cy="16" r="5" fill="#38bdf8">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1">
      AUTONOMOUS WEB AGENTS
    </text>
  </g>

  <!-- Title: Foreground Crisp & Punchy -->
  <g transform="translate(60, 138)">
    <text x="0" y="0" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
      Awesome Autonomous Browser Agents
    </text>
  </g>

  <!-- Subtitle: Clean & Readable -->
  <g transform="translate(60, 185)">
    <text x="0" y="0" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0">
      &amp; Intelligent Web Interaction Ecosystem
    </text>
  </g>

  <!-- Description / Tagline -->
  <g transform="translate(60, 222)">
    <text x="0" y="0" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400">
      Curated showcase of hosted platforms, headless browser runtimes, LLM vision agents, and stealth automation.
    </text>
  </g>

  <!-- Animated Feature Badges / Highlights (Positioned cleanly at bottom) -->
  <g transform="translate(60, 275)" class="wave-pulse">
    <!-- Pill 1: Headless Browsers -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="16" y="26" font-size="18">🌐</text>
      <text x="44" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Cloud Browsers</text>
    </g>

    <!-- Pill 2: Vision & LLM Agents -->
    <g transform="translate(195, 0)">
      <rect width="180" height="42" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="16" y="26" font-size="18">🤖</text>
      <text x="44" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">LLM &amp; VLM Agents</text>
    </g>

    <!-- Pill 3: Anti-Detect & Stealth -->
    <g transform="translate(390, 0)">
      <rect width="185" height="42" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="16" y="26" font-size="18">🛡️</text>
      <text x="44" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Stealth &amp; Anti-Bot</text>
    </g>

    <!-- Pill 4: Playwright & CDP -->
    <g transform="translate(590, 0)">
      <rect width="180" height="42" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="16" y="26" font-size="18">⚡</text>
      <text x="44" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Playwright &amp; CDP</text>
    </g>

    <!-- Pill 5: Self-Hosted -->
    <g transform="translate(785, 0)">
      <rect width="175" height="42" rx="10" fill="url(#pillGrad)" stroke="#334155" stroke-width="1.2" filter="url(#cardShadow)" />
      <text x="16" y="26" font-size="18">📦</text>
      <text x="44" y="26" fill="#f1f5f9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Self-Hosted Grids</text>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>